name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml: a version is published only after the same checks passed.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Generated API client is up to date
        run: |
          npm run generate-client
          git diff --exit-code -- packages/api-client
