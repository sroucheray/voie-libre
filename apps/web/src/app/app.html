<header class="app-header">
  <img class="logo" src="icons/logo.svg" alt="" width="36" height="36" />
  <h1>{{ 'app.title' | transloco }}</h1>
  <span class="spacer"></span>
  <vl-api-status />
  <vl-language-switch />
  @if (donation) {
  <a
    class="donate"
    [href]="donation"
    target="_blank"
    rel="noopener noreferrer"
    [title]="'about.donate' | transloco"
  >
    <vl-icon name="heart" />
    <span>{{ 'about.donate' | transloco }}</span>
  </a>
  }
  <vl-about />
</header>
<vl-welcome />
<vl-update-prompt />
<main>
  <div class="status-bar">
    <p>{{ 'app.tagline' | transloco }}</p>
    <vl-offline-map />
  </div>
  <div class="stage">
    <vl-phone-menu class="phone-menu" />
    <vl-planner class="map" />
    <router-outlet />
  </div>
</main>
