<div class="field" [class.field--disabled]="disabled()">
  @if (!bareMarker()) {
  <span
    class="field__marker"
    [class.field__marker--start]="role() === 'start'"
    [class.field__marker--end]="role() === 'end'"
    [class.field__marker--stop]="role() === 'stop'"
    aria-hidden="true"
    >{{ marker() }}</span
  >
  }
  <input
    #field
    type="text"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    aria-autocomplete="list"
    [id]="inputId"
    [value]="shown()"
    [disabled]="disabled()"
    [placeholder]="'planner.search.placeholder.' + role() | transloco"
    [attr.aria-label]="'planner.search.' + role() | transloco : { n: number() }"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-busy]="searching()"
    [attr.aria-activedescendant]="active() >= 0 ? optionId(active()) : null"
    (focus)="onFocus($event)"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
  @if (canLocate()) {
  <button
    type="button"
    class="field__locate"
    [title]="'planner.search.myPosition' | transloco"
    [attr.aria-label]="'planner.search.myPosition' | transloco"
    (click)="pickPosition()"
  >
    <vl-icon name="locate" />
  </button>
  } @if (searching()) {
  <span class="spinner" aria-hidden="true"></span>
  <span class="visually-hidden" role="status"
    >{{ 'planner.search.searching' | transloco }}</span
  >
  } @if (open()) {
  <!-- The box rounds and clips; the list inside scrolls, so its scrollbar stays within the corners. -->
  <div
    class="suggestions-box"
    [style.left.px]="box()?.left"
    [style.top.px]="box()?.top"
    [style.width.px]="box()?.width"
    [style.visibility]="box() ? null : 'hidden'"
  >
    <ul class="suggestions" role="listbox" [id]="listId">
      @for (place of results(); track $index; let i = $index) {
      <!-- The focus stays in the input (aria-activedescendant), keys are handled there. -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        role="option"
        [id]="optionId(i)"
        [class.suggestions__active]="i === active()"
        [attr.aria-selected]="i === active()"
        (mousedown)="$event.preventDefault()"
        (click)="pick(place)"
      >
        {{ place.label }}
      </li>
      }
    </ul>
  </div>
  }
</div>
@if (messageKey(); as key) {
<p class="message" role="status">{{ key | transloco }}</p>
}
