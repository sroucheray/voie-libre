<div class="field" [class.field--disabled]="disabled()">
  <span
    class="field__marker"
    [class.field__marker--stop]="role() === 'stop'"
    aria-hidden="true"
    >{{ marker() }}</span
  >
  <input
    #field
    type="text"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    aria-autocomplete="list"
    [id]="inputId"
    [value]="shown()"
    [disabled]="disabled()"
    [placeholder]="'planner.search.placeholder.' + role() | transloco"
    [attr.aria-label]="'planner.search.' + role() | transloco : { n: number() }"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="active() >= 0 ? optionId(active()) : null"
    (focus)="onFocus($event)"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
  @if (open()) {
  <ul class="suggestions" role="listbox" [id]="listId">
    @if (offersPosition()) {
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <li
      role="option"
      class="suggestions__position"
      [id]="optionId(0)"
      [class.suggestions__active]="active() === 0"
      [attr.aria-selected]="active() === 0"
      (mousedown)="$event.preventDefault()"
      (click)="pickPosition()"
    >
      {{ 'planner.search.myPosition' | transloco }}
    </li>
    } @for (place of results(); track $index; let i = $index) {
    <!-- The focus stays in the input (aria-activedescendant), keys are handled there. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <li
      role="option"
      [id]="optionId(i)"
      [class.suggestions__active]="i === active()"
      [attr.aria-selected]="i === active()"
      (mousedown)="$event.preventDefault()"
      (click)="pick(place)"
    >
      {{ place.label }}
    </li>
    }
  </ul>
  }
</div>
@if (messageKey(); as key) {
<p class="message" role="status">{{ key | transloco }}</p>
}
