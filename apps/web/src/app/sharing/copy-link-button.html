<button
  type="button"
  class="copy-link"
  [disabled]="!url()"
  [attr.aria-label]="
    name() ? ('sharing.link.copyNamed' | transloco : { name: name() }) : null
  "
  [attr.title]="'sharing.link.privacy' | transloco"
  (click)="copy()"
>
  {{ 'sharing.link.copy' | transloco }}
</button>
@switch (state()) { @case ('copied') {
<span class="copy-status" role="status"
  >{{ 'sharing.link.copied' | transloco }} {{ 'sharing.link.privacy' | transloco
  }}</span
>
} @case ('failed') {
<span class="copy-status" role="alert"
  >{{ 'sharing.link.failed' | transloco }}
  <input
    type="text"
    readonly
    [value]="url()"
    [attr.aria-label]="'sharing.link.field' | transloco"
    (focus)="select($event)"
/></span>
} }
