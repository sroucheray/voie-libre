<button
  type="button"
  class="copy-link"
  [disabled]="!url()"
  [attr.aria-label]="
    name() ? ('sharing.link.copyNamed' | transloco : { name: name() }) : null
  "
  (click)="copy()"
>
  {{ 'sharing.link.copy' | transloco }}
</button>
@if (canShare) {
<button
  type="button"
  class="share-link"
  [disabled]="!url()"
  [attr.aria-label]="
    name() ? ('sharing.link.shareNamed' | transloco : { name: name() }) : null
  "
  (click)="share()"
>
  {{ 'sharing.link.share' | transloco }}
</button>
} @if (qr()) {
<button
  type="button"
  class="show-qr"
  [attr.aria-expanded]="qrShown()"
  [attr.aria-label]="
    name() ? ('sharing.link.qrNamed' | transloco : { name: name() }) : null
  "
  (click)="toggleQr()"
>
  {{ (qrShown() ? 'sharing.link.qrHide' : 'sharing.link.qr') | transloco }}
</button>
} @if (qrShown() && qr(); as code) {
<figure class="qr">
  <svg
    role="img"
    [attr.aria-label]="'sharing.link.qrLabel' | transloco"
    [attr.viewBox]="code.viewBox"
    shape-rendering="crispEdges"
  >
    <rect width="100%" height="100%" fill="#fff" />
    <path [attr.d]="code.path" fill="#000" />
  </svg>
  <figcaption>{{ 'sharing.link.qrHelp' | transloco }}</figcaption>
</figure>
} @switch (state()) { @case ('copied') {
<span class="copy-status" role="status"
  >{{ 'sharing.link.copied' | transloco }} {{ 'sharing.link.privacy' | transloco
  }}</span
>
} @case ('failed') {
<span class="copy-status" role="alert"
  >{{ 'sharing.link.failed' | transloco }}
  <input
    type="text"
    readonly
    [value]="url()"
    [attr.aria-label]="'sharing.link.field' | transloco"
    (focus)="select($event)"
/></span>
} }
