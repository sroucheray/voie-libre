@if (loading() || error()) {
<aside class="shared" [attr.aria-label]="'sharing.page.title' | transloco">
  <h2>{{ 'sharing.page.title' | transloco }}</h2>
  @if (loading()) {
  <p role="status">{{ 'sharing.page.loading' | transloco }}</p>
  } @if (error(); as code) {
  <p class="error" role="alert">{{ 'sharing.errors.' + code | transloco }}</p>
  }
  <a routerLink="/" replaceUrl class="close"
    >{{ 'sharing.page.close' | transloco }}</a
  >
</aside>
} @if (route(); as shared) {
<vl-opened-route-dialog
  [name]="shared.name"
  [route]="openedRoute()"
  (closed)="done()"
/>
}
