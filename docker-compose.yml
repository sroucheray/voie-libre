# Local development infrastructure.
#   docker compose up -d                  PostgreSQL/PostGIS + BRouter (run the API and the web app with `npm run dev`)
#   docker compose --profile full up -d   also run the API in a container (then do not run it with `npm run dev`)
# BRouter needs routing segments first: ./scripts/download-segments.sh
# The map needs the basemap first: ./scripts/download-basemap.sh
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voielibre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voielibre}
      POSTGRES_DB: ${POSTGRES_DB:-voielibre}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  brouter:
    # Built from the BRouter commit validated by the spike (see spike/brouter/RAPPORT.md).
    build:
      context: https://github.com/abrensch/brouter.git#fed8f185ecdba4c01f4d6913bff7c0fae4576a32
    environment:
      MAXTHREADS: '2'
      JAVA_OPTS: '-Xmx256M -Xms256M -DmaxRunningTime=300 -DuseRFCMimeType=false'
    ports:
      - '127.0.0.1:${BROUTER_PORT:-17777}:17777'
    volumes:
      - ${BROUTER_SEGMENTS_DIR:-./data/brouter/segments4}:/segments4:ro
    mem_limit: 512m
    restart: unless-stopped

  tiles:
    # Serves data/basemap (PMTiles, fonts, sprites) with Range requests and CORS.
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${TILES_PORT:-8081}:80'
    volumes:
      - ${BASEMAP_DIR:-./data/basemap}:/usr/share/nginx/html:ro
      - ./docker/tiles/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-voielibre}:${POSTGRES_PASSWORD:-voielibre}@db:5432/${POSTGRES_DB:-voielibre}
      BROUTER_URL: http://brouter:17777
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
