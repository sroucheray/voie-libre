# Static file server for the basemap (PMTiles, fonts, sprites).
# nginx answers HTTP Range requests natively, which PMTiles needs; CORS lets the web app read them.
# Cached for an hour when the file exists; an error is never cached (a 404 seen before a download
# finished would otherwise leave the map empty for an hour).
map $status $tiles_cache_control {
  ~^2 "public, max-age=3600";
  default "no-store";
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Range, If-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Cache-Control $tiles_cache_control always;
    if ($request_method = OPTIONS) { return 204; }
    try_files $uri =404;
  }
}
