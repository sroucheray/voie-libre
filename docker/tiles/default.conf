# Static file server for the basemap (PMTiles, fonts, sprites).
# nginx answers HTTP Range requests natively, which PMTiles needs; CORS lets the web app read them.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Range, If-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Cache-Control "public, max-age=3600" always;
    if ($request_method = OPTIONS) { return 204; }
    try_files $uri =404;
  }
}
