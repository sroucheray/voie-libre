<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-label="Local app, server to compute and share" font-size="13">
<style>
  svg { --edge:#8a8f98; --grid:#c9cdd3; --accent:#2a7de1; --ink:#1b1f24; --quiet:#5c6370; font-family: system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --edge:#8a8f98; --grid:#3d434b; --accent:#6aa9ff; --ink:#e8eaed; --quiet:#a0a6b0; }
  }
  .ink { fill: var(--ink); } .quiet { fill: var(--quiet); }
  .name { font-weight: 600; }
</style>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs>
