<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="The foundation makes the app usable before any community feature" font-size="13">
<style>
  svg { --edge:#8a8f98; --grid:#c9cdd3; --accent:#2a7de1; --ink:#1b1f24; --quiet:#5c6370; font-family: system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --edge:#8a8f98; --grid:#3d434b; --accent:#6aa9ff; --ink:#e8eaed; --quiet:#a0a6b0; }
  }
  .ink { fill: var(--ink); } .quiet { fill: var(--quiet); }
  .name { font-weight: 600; }
</style>
<defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs>
<text x="24" y="34" class="ink name" font-size="15">Le socle rend l’application utilisable avant toute fonction communautaire</text>
<rect x="24" y="76" width="136" height="160" rx="8" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2"/><text x="36" y="98" class="quiet" font-size="11.5">Phase 1</text><text x="36" y="118" class="ink name" >Socle</text><text x="36" y="140" class="ink" font-size="11.5">carte et routage</text><text x="36" y="156" class="ink" font-size="11.5">profils et GPX</text><text x="36" y="172" class="ink" font-size="11.5">sauvegarde locale</text><text x="36" y="188" class="ink" font-size="11.5">partage par lien</text><text x="36" y="204" class="ink" font-size="11.5">consultation</text><text x="36" y="220" class="ink" font-size="11.5">hors-ligne</text>
<rect x="168" y="76" width="136" height="160" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/><text x="180" y="98" class="quiet" font-size="11.5">Phase 2</text><text x="180" y="118" class="ink name" >Planification</text><text x="180" y="140" class="ink" font-size="11.5">alternatives</text><text x="180" y="156" class="ink" font-size="11.5">édition à la main</text><text x="180" y="172" class="ink" font-size="11.5">boucles</text><text x="180" y="188" class="ink" font-size="11.5">distance cible</text><text x="180" y="204" class="ink" font-size="11.5">dénivelé cible</text>
<rect x="312" y="76" width="136" height="160" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/><text x="324" y="98" class="quiet" font-size="11.5">Phase 3</text><text x="324" y="118" class="ink name" >Signalements</text><text x="324" y="140" class="ink" font-size="11.5">zones à éviter</text><text x="324" y="156" class="ink" font-size="11.5">personnelles</text><text x="324" y="172" class="ink" font-size="11.5">notes OSM</text><text x="324" y="188" class="ink" font-size="11.5">expiration</text>
<rect x="456" y="76" width="136" height="160" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/><text x="468" y="98" class="quiet" font-size="11.5">Phase 4</text><text x="468" y="118" class="ink name" >Communauté</text><text x="468" y="140" class="ink" font-size="11.5">parcours publics</text><text x="468" y="156" class="ink" font-size="11.5">évaluations</text><text x="468" y="172" class="ink" font-size="11.5">zones partagées</text><text x="468" y="188" class="ink" font-size="11.5">découverte</text>
<rect x="600" y="76" width="136" height="160" rx="8" fill="none" fill-opacity="1" stroke="var(--edge)" stroke-width="1.25"/><text x="612" y="98" class="quiet" font-size="11.5">Phase 5</text><text x="612" y="118" class="ink name" >Plus tard</text><text x="612" y="140" class="ink" font-size="11.5">calcul local</text><text x="612" y="156" class="ink" font-size="11.5">navigation guidée</text><text x="612" y="172" class="ink" font-size="11.5">Expo ou natif</text><text x="612" y="188" class="ink" font-size="11.5">si besoin</text>
<path d="M24 262H736" fill="none" stroke="var(--edge)" stroke-width="1.25" marker-end="url(#road-arrow)"/>
<text x="380" y="286" class="quiet" text-anchor="middle" font-size="11.5">ordre de réalisation, dates à fixer</text>
</svg>
